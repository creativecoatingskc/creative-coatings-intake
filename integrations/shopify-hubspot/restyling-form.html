<section style="max-width:740px;margin:24px auto;padding:24px;border-top:4px solid #b88600;background:#192125;color:#f2ede3;font-family:Arial,sans-serif;border-radius:8px"><header><strong style="font-size:21px;font-style:italic">CREATIVE COATINGS</strong><h2>Vehicle Restyling Quote</h2><p>Tell us about your vehicle and the look or protection you're after.</p></header><form id="restyle-form"><div id="restyle-fields" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px"></div><div id="service-details" style="margin-top:16px"></div><div style="margin-top:16px"><label>Upload vehicle photos or inspiration images (optional)<input type="file" name="artworkFiles" multiple accept=".ai,.eps,.pdf,.svg,.png,.jpg,.jpeg,.webp" style="display:block;margin-top:8px;max-width:100%"></label><small>Up to 10 files, 25 MB each; 60 MB total.</small></div><label style="display:none">Website<input name="website" tabindex="-1" autocomplete="off"></label><button type="submit" style="background:#b88600;color:#192125;border:0;border-radius:5px;padding:13px 20px;margin-top:20px;font-weight:bold;cursor:pointer">Request My Quote</button><p id="restyle-result" role="status" aria-live="polite"></p><small>By submitting, you agree that Creative Coatings may contact you about your request. No promotional messages without separate consent.</small></form></section>
<script>
(()=>{
const endpoint="/api/vehicle-restyling";
const fields=[["firstName","First name","text",true],["lastName","Last name","text",true],["email","Email","email",true],["phone","Phone","tel",true],["vehicleDetails","Vehicle year / make / model","text",true],["service","Service","select",true,["Window tint","Color-change wrap","Paint protection film (PPF)","Chrome delete","Two-tone / custom styling","Other"]],["timeline","Ideal timeline","select",true,["ASAP","Within 2 weeks","Within 1 month","1–3 months","Exploring"]],["budget","Approximate budget (optional)","text",false],["notes","Additional details","textarea",false]];
const root=document.getElementById("restyle-fields"),detail=document.getElementById("service-details"),form=document.getElementById("restyle-form"),msg=document.getElementById("restyle-result");
function field(name,label,type,required,options){const wrap=document.createElement("label");wrap.style.cssText="display:flex;flex-direction:column;gap:6px;font-size:14px;margin-top:8px";const title=document.createElement("span");title.textContent=label+(required?" *":"");wrap.append(title);const el=document.createElement(type==="select"?"select":type==="textarea"?"textarea":"input");if(type!=="select"&&type!=="textarea")el.type=type;el.name=name;el.required=required;el.style.cssText="padding:10px;border:1px solid #b6aa8b;border-radius:4px;background:white;color:#192125;min-width:0";if(options){const blank=document.createElement("option");blank.value="";blank.textContent="Select one";el.append(blank);options.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;el.append(o)})}wrap.append(el);return wrap}
fields.forEach(f=>root.append(field(...f)));
const options={
"Window tint":[["tintWindows","Which windows?","select",true,["Two front windows","Full vehicle (side and rear)","Windshield only","Full vehicle plus windshield","Other / not sure"]],["tintFilm","Film preference","select",true,["Standard","Ceramic","Premium ceramic","Not sure"]]],
"Color-change wrap":[["desiredColor","Desired color / finish","text",true],["wrapCoverage","Coverage","select",true,["Full exterior","Two-tone","Partial accents","Not sure"]],["doorJambs","Include door jambs?","select",true,["Yes","No","Not sure"]]],
"Paint protection film (PPF)":[["ppfCoverage","Protection coverage","select",true,["Partial front","Full front","Full vehicle","Other / not sure"]],["ppfFinish","Finish","select",true,["Clear gloss","Matte","Color PPF","Not sure"]]],
"Chrome delete":[["chromeAreas","Which trim or areas?","textarea",true]],
"Two-tone / custom styling":[["customStyle","Describe the style or areas","textarea",true]],
"Other":[["customStyle","Describe what you need","textarea",true]]
};
const service=form.elements.namedItem("service");function update(){detail.replaceChildren();const selected=service.value;if(!selected)return;const h=document.createElement("h3");h.textContent="Project details";detail.append(h);(options[selected]||[]).forEach(f=>detail.append(field(...f)))}service.addEventListener("change",update);
form.addEventListener("submit",async e=>{e.preventDefault();const btn=form.querySelector("button");btn.disabled=true;msg.textContent="Sending your request...";const data=new FormData(form);data.set("submissionId",form.dataset.submissionId||(form.dataset.submissionId=crypto.randomUUID()));try{const r=await fetch(endpoint,{method:"POST",body:data});const response=await r.json();if(!r.ok||!response.ok)throw Error(response.error||"Submission failed");msg.textContent="Thank you! Your request has been received. Reference: "+response.reference+(response.uploadWarning?" Please contact us about your uploaded photos.":"");form.reset();update();delete form.dataset.submissionId}catch(err){msg.textContent="Unable to submit right now. Please call Creative Coatings. "+err.message}finally{btn.disabled=false}});
})();
</script>
