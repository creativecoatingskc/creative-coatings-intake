<section style="max-width:780px;margin:20px auto;padding:26px;background:#192125;color:#f2ede3;border-top:4px solid #b88600;border-radius:8px;font:16px Arial,sans-serif"><h1>Request a Quote</h1><p>Tell us what you need. We handle vehicle branding, tint, PPF, signage, apparel, embroidery, DTF transfers, promotional products, and more.</p><form id="general-form"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px" id="fields"></div><label style="display:none">Website<input name="website" tabindex="-1" autocomplete="off"></label><p><label>Upload artwork or reference photos (optional)<input type="file" name="artworkFiles" multiple accept=".ai,.eps,.pdf,.svg,.png,.jpg,.jpeg,.webp" style="display:block;margin-top:8px;max-width:100%"></label><small>Up to 10 files, 25 MB each, 60 MB total.</small></p><button type="submit" id="submit" style="background:#b88600;color:#192125;border:0;border-radius:5px;padding:14px 22px;font-weight:bold;cursor:pointer">Request My Quote</button><p id="result" role="status" aria-live="polite"></p><small>By submitting, you agree we may contact you about your request.</small></form></section><script>(()=>{const form=document.getElementById('general-form'),container=document.getElementById('fields'),msg=document.getElementById('result');function field(name,label,type='text',required=false,opts=[]){const wrap=document.createElement('label');wrap.style.cssText='display:flex;flex-direction:column;gap:6px;font-size:14px';wrap.textContent=label+(required?' *':'');let e=document.createElement(type==='select'?'select':type==='textarea'?'textarea':'input');if(type!=='select'&&type!=='textarea')e.type=type;e.name=name;e.required=required;e.style.cssText='padding:11px;border-radius:4px;border:1px solid #a69d87;background:#fff;color:#192125;width:100%;box-sizing:border-box;min-width:0';if(type==='select'){e.append(new Option('Select one',''));opts.forEach(v=>e.append(new Option(v,v)))}if(type==='textarea'){e.rows=5}wrap.append(e);container.append(wrap);return e}field('businessName','Business / organization (optional)');field('firstName','First name','text',true);field('lastName','Last name','text',true);field('email','Email','email',true);field('phone','Phone','tel',true);const category=field('category','What do you need a quote for?','select',true,['Commercial vehicle wraps / fleet graphics','Vehicle restyling / color change','Automotive window tint','Paint protection film (PPF)','Architectural / flat glass tint','Signs / banners / decals','Apparel / screen printing / DTF','Embroidery / hats','Promotional products','Other / multiple services']);const detail=field('projectDetails','Describe your project, quantity, dimensions, vehicle year/make/model, or products needed','textarea',true);detail.maxLength=2000;field('timeline','Ideal timeline','select',true,['ASAP','Within 2 weeks','Within 1 month','1–3 months','Just exploring']);field('budget','Approximate budget (optional)');form.addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;msg.textContent='Submitting your request...';try{const data=new FormData(form);data.set('submissionId',crypto.randomUUID());const r=await fetch('/api/general-quote',{method:'POST',body:data});const x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||'Submission failed');form.reset();msg.textContent='Thank you! Your quote request was received. We will be in touch shortly.';}catch(err){msg.textContent='Unable to submit: '+err.message+'. Please contact Creative Coatings.'}finally{btn.disabled=false}})})();</script>
