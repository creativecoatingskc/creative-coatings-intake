<section style="max-width:740px;margin:24px auto;padding:24px;border-top:4px solid #b88600;background:#192125;color:#f2ede3;font-family:Arial,sans-serif;border-radius:8px"><header><strong style="font-size:21px;font-style:italic">CREATIVE COATINGS</strong><h2>Business Signage Quote</h2><p>Tell us about your signage project. We'll review the details and follow up.</p></header><form id="signage-form"><div id="signage-fields" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px"></div><div id="signage-details"></div><div style="margin-top:16px"><label>Upload logos, artwork, measurements, or photos (optional)<input type="file" name="artworkFiles" multiple accept=".ai,.eps,.pdf,.svg,.png,.jpg,.jpeg,.webp" style="display:block;margin-top:8px;max-width:100%"></label><small>Up to 10 files, 25 MB each; 60 MB total.</small></div><label style="display:none">Website<input name="website" tabindex="-1" autocomplete="off"></label><button type="submit" style="background:#b88600;color:#192125;border:0;border-radius:5px;padding:13px 20px;margin-top:20px;font-weight:bold;cursor:pointer">Request My Quote</button><p id="signage-result" role="status" aria-live="polite"></p><small>By submitting, you agree that Creative Coatings may contact you about this request. No promotional messages without separate consent.</small></form></section>
<script>
(()=>{
const form=document.getElementById("signage-form"),root=document.getElementById("signage-fields"),detail=document.getElementById("signage-details"),msg=document.getElementById("signage-result");
function field(name,label,type,required,options){const w=document.createElement("label");w.style.cssText="display:flex;flex-direction:column;gap:6px;font-size:14px;margin-top:10px";const t=document.createElement("span");t.textContent=label+(required?" *":"");w.append(t);const e=document.createElement(type==="select"?"select":type==="textarea"?"textarea":"input");if(type!=="select"&&type!=="textarea")e.type=type;e.name=name;e.required=required;e.style.cssText="padding:10px;border:1px solid #b6aa8b;border-radius:4px;background:#fff;color:#192125;min-width:0";if(options){const blank=document.createElement("option");blank.value="";blank.textContent="Select one";e.append(blank);options.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;e.append(o)})}w.append(e);return w}
const base=[["businessName","Business / organization name","text",true],["firstName","First name","text",true],["lastName","Last name","text",true],["email","Email","email",true],["phone","Phone","tel",true],["signageType","Signage type","select",true,["Banners","Yard signs","Storefront / exterior signs","Window graphics / perforated film","Wall / interior graphics","Decals / stickers","Other signage"]],["quantity","Quantity","number",true],["dimensions","Approximate size (width x height, with units)","text",true],["artworkStatus","Artwork status","select",true,["Print-ready","Have logo / brand assets","Need design","Not sure"]],["installation","Do you need installation?","select",true,["Yes","No","Not sure"]],["timeline","Ideal timeline","select",true,["ASAP","Within 2 weeks","Within 1 month","1–3 months","Exploring"]],["budget","Approximate budget (optional)","text",false],["notes","Additional details","textarea",false]];
base.forEach(f=>root.append(field(...f)));const qty=form.elements.namedItem("quantity");qty.min="1";qty.max="10000";qty.value="1";
const variants={"Banners":[["bannerUse","Banner use","select",true,["Indoor","Outdoor","Both / not sure"]],["bannerFinish","Finishing","select",true,["Hem and grommets","Pole pockets","Not sure"]]],"Yard signs":[["signSides","Printed sides","select",true,["Single-sided","Double-sided","Not sure"]],["stakes","Include stakes?","select",true,["Yes","No","Not sure"]]],"Storefront / exterior signs":[["signSurface","Installation surface / location","text",true]],"Window graphics / perforated film":[["windowCoverage","Window graphics type","select",true,["Perforated one-way vision","Solid / opaque","Frosted / etched look","Not sure"]]],"Wall / interior graphics":[["signSurface","Wall surface / location","text",true]],"Decals / stickers":[["decalUse","Intended use","select",true,["Indoor","Outdoor","Both / not sure"]]],"Other signage":[["customDetails","Describe your sign","textarea",true]]};
const type=form.elements.namedItem("signageType");function update(){detail.replaceChildren();if(!type.value)return;const h=document.createElement("h3");h.textContent="Sign details";detail.append(h);(variants[type.value]||[]).forEach(f=>detail.append(field(...f)))}type.addEventListener("change",update);
form.addEventListener("submit",async e=>{e.preventDefault();const btn=form.querySelector("button");btn.disabled=true;msg.textContent="Sending your request...";const data=new FormData(form);data.set("submissionId",form.dataset.submissionId||(form.dataset.submissionId=crypto.randomUUID()));try{const r=await fetch("/api/business-signage",{method:"POST",body:data});const response=await r.json();if(!r.ok||!response.ok)throw Error(response.error||"Submission failed");msg.textContent="Thank you! Your request has been received. Reference: "+response.reference+(response.uploadWarning?" Please contact us about your uploaded artwork.":"");form.reset();update();delete form.dataset.submissionId}catch(err){msg.textContent="Unable to submit right now. Please call Creative Coatings. "+err.message}finally{btn.disabled=false}});
})();
</script>
