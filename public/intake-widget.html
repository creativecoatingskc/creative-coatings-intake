<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Creative Coatings Job Intake</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}
    body{margin:0;background:transparent}
    .card{max-width:720px;margin:0 auto;padding:20px}
    .panel{border:1px solid rgba(127,127,127,.28);border-radius:18px;padding:22px;background:rgba(127,127,127,.06)}
    h1{font-size:22px;margin:0 0 6px}
    p{margin:0 0 18px;opacity:.75}
    .options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    button{padding:14px 16px;border-radius:12px;border:1px solid rgba(127,127,127,.35);background:rgba(127,127,127,.08);font:inherit;font-weight:700;cursor:pointer}
    button:hover{outline:2px solid currentColor}
    #result{margin-top:16px;font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <div class="panel">
      <h1>Creative Coatings Job Intake</h1>
      <p>Is this an existing customer?</p>
      <div class="options">
        <button type="button" data-value="Yes">Yes</button>
        <button type="button" data-value="No">No</button>
      </div>
      <div id="result" aria-live="polite"></div>
    </div>
  </div>
  <script>
    const result = document.getElementById("result");
    document.querySelectorAll("button[data-value]").forEach((button) => {
      button.addEventListener("click", () => {
        result.textContent = "Selected: " + button.dataset.value;
      });
    });
  </script>
</body>
</html>
