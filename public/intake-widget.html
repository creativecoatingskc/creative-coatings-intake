<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Creative Coatings Project Intake</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: transparent; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 18px; }
    .card { border: 1px solid rgba(127,127,127,.28); border-radius: 18px; padding: 20px; background: rgba(127,127,127,.06); }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .brand { font-weight: 800; font-size: 18px; }
    .step { font-size: 12px; opacity: .68; }
    h2 { font-size: 22px; line-height: 1.2; margin: 0 0 16px; }
    .hint { margin: -8px 0 16px; opacity: .7; font-size: 13px; }
    input, textarea { width: 100%; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(127,127,127,.35); padding: 13px 14px; font: inherit; background: transparent; }
    textarea { min-height: 110px; resize: vertical; }
    .options { display:grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap:10px; }
    button.option, button.primary, button.secondary { border-radius: 12px; border: 1px solid rgba(127,127,127,.35); padding: 12px 14px; font: inherit; cursor: pointer; }
    button.option { background: rgba(127,127,127,.07); text-align:left; font-weight:650; }
    button.option:hover, button.option.selected { outline: 2px solid currentColor; }
    .actions { display:flex; gap:10px; justify-content:space-between; margin-top:18px; }
    .right { margin-left:auto; display:flex; gap:10px; }
    button.primary { background: #111; color:#fff; border-color:#111; font-weight:750; }
    @media (prefers-color-scheme: dark) { button.primary { background:#fff; color:#111; border-color:#fff; } }
    button.secondary { background: transparent; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .summary { white-space: pre-wrap; background: rgba(127,127,127,.08); border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.45; max-height: 420px; overflow:auto; }
    .status { display:inline-block; border-radius:999px; padding:7px 10px; font-weight:800; font-size:12px; margin-bottom:12px; }
    .green { background:#d9fbe4; color:#14532d; }
    .yellow { background:#fff4c2; color:#713f12; }
    .red { background:#fee2e2; color:#7f1d1d; }
    .progress { height:6px; background:rgba(127,127,127,.18); border-radius:999px; overflow:hidden; margin-bottom:18px; }
    .progress > div { height:100%; background:currentColor; opacity:.65; transition:width .2s ease; }
    .small { font-size:12px; opacity:.68; }
    .notice { border-left: 4px solid currentColor; padding: 10px 12px; background:rgba(127,127,127,.07); border-radius:8px; margin:12px 0; }
  </style>
</head>

const app = document.getElementById('app');
const state = window.openai?.widgetState?.privateContent || { answers:{}, history:[], idx:0 };
state.answers ||= {};

function rootQuestions(a){
  const out = [
    yesNo('existing_customer','Is this an existing customer?',{required:true})
  ];

  if(a.existing_customer==='Yes'){
    out.push(
      textQ('first_name','What is the customer’s first name?',{required:true,placeholder:'First name'}),
      textQ('last_name','What is the customer’s last name?',{required:true,placeholder:'Last name'}),
      q('printavo_lookup','Find this customer in Printavo','lookup',{required:true})
    );
  }

  if(a.existing_customer==='No'){
    out.push(
      textQ('first_name','What is the customer’s first name?',{required:true,placeholder:'First name'}),
      textQ('last_name','What is the customer’s last name?',{required:true,placeholder:'Last name'}),
      textQ('business_name','What is the customer’s business name, if applicable?',{placeholder:'Business name'}),
      textQ('phone','What is the customer’s phone number?',{required:true,placeholder:'Phone number'}),
      textQ('email','What is the customer’s email address?',{required:true,placeholder:'Email address'}),
      textQ('billing_address','What is the customer’s billing address?',{required:true,placeholder:'Street, city, state, ZIP'})
    );
  }

  if(a.existing_customer){
    out.push(q('category','What type of project is the customer looking for?','single',{required:true, options:[
      'Printed Vinyl Graphics','Window Film','Paint Protection Film (PPF)','Signage','Apparel','Promotional Products','Other / Custom Project'
    ]}));
  }

  return out;
}

function q(id,label,type,extra={}) { return {id,label,type,...extra}; }
function yesNo(id,label,extra={}) { return q(id,label,'single',{options:['Yes','No'],...extra}); }
function select(id,label,options,extra={}) { return q(id,label,'single',{options,...extra}); }
function multi(id,label,options,extra={}) { return q(id,label,'multi',{options,...extra}); }
function textQ(id,label,extra={}) { return q(id,label,'text',extra); }

function categoryQuestions(a){
  switch(a.category){
    case 'Printed Vinyl Graphics': return printedVinyl(a);
    case 'Window Film': return windowFilm(a);
    case 'Paint Protection Film (PPF)': return ppf(a);
    case 'Signage': return signage(a);
    case 'Apparel': return apparel(a);
    case 'Promotional Products': return promo(a);
    case 'Other / Custom Project': return custom(a);
    default: return [];
  }
}

function printedVinyl(a){
  const out = [select('vinyl_applied_to','What will the graphics be applied to?',['Vehicle','Trailer','Storefront / Windows','Wall','Floor','Equipment / Machinery','Other','Not Sure'],{required:true})];
  if(a.vinyl_applied_to==='Vehicle') out.push(...vehicle(a));
  else if(a.vinyl_applied_to==='Trailer') out.push(...trailer(a));
  else if(a.vinyl_applied_to==='Storefront / Windows') out.push(...storefront(a));
  else if(a.vinyl_applied_to==='Wall') out.push(...wall(a));
  else if(a.vinyl_applied_to==='Floor') out.push(...floor(a));
  else if(a.vinyl_applied_to==='Equipment / Machinery') out.push(...equipment(a));
  else if(['Other','Not Sure'].includes(a.vinyl_applied_to)) out.push(textQ('vinyl_other_desc','In the customer’s own words, what are they wanting done?',{required:true,multiline:true}));
  return out;
}

function vehicle(a){
  const out=[
    textQ('vehicle','What is the year, make, and model of the vehicle?',{required:true,placeholder:'2026 Ford F-150'}),

}

      select('banner_use','Will the banner be used indoors or outdoors?',['Indoor','Outdoor','Both / Mixed Use','Not Sure'],{required:true}),
      multi('banner_finishing','What finishing does the banner need?',['Hemmed Edges','Grommets','Pole Pockets','Wind Slits','No Special Finishing','Not Sure'],{required:true}),
      select('banner_art','What is the artwork status?',['Print Ready','Artwork Received – Changes Needed','Customer Needs to Send Artwork','Creative Coatings Needs to Design It','Not Sure'],{required:true}),
      textQ('banner_content','What wording, logos, or information needs to appear on the banner?',{required:true,multiline:true}),
      select('banner_install','Does Creative Coatings need to install or hang the banner?',['Yes','No','Not Sure'],{required:true})
    );
    if(a.banner_install==='Yes'){
      out.push(
        textQ('banner_install_address','What is the installation address?',{required:true}),
        yesNo('banner_site_photos','Do we have photos of where the banner will be installed?',{required:true})
      );
    }
    out.push(...deadlineQuestions('banner'));
    return out;
  }

  if(a.sign_type){
    out.push(
      textQ('sign_width','What is the sign width?',{required:true}),
      textQ('sign_height','What is the sign height?',{required:true}),
      textQ('sign_qty','What quantity does the customer need?',{required:true}),
      select('sign_sides','Single or double-sided?',['Single-Sided','Double-Sided','Not Sure'],{required:true}),
      select('sign_material','Does the customer know what material they want?',['Yes','No – Recommend Material'],{required:true}),
      select('sign_install','Does Creative Coatings need to install it?',['Yes','No','Not Sure'],{required:true})
    );
    if(a.sign_install==='Yes'){
      out.push(
        textQ('sign_address','What is the installation address?',{required:true}),
        yesNo('sign_site_photos','Do we have site photos?',{required:true})
      );
    }
    out.push(...deadlineQuestions('sign'));
  }
  return out;
}

function apparel(a){ return [select('apparel_type','What does the customer need?',['T-Shirts','Polos','Hoodies / Sweatshirts','Hats','Jackets / Outerwear','Workwear','Multiple Garment Types','Customer-Supplied Garments','Other'],{required:true}),textQ('apparel_qty','What is the approximate quantity?',{required:true}),textQ('apparel_color','What garment color does the customer want?',{required:true}),select('decoration','What decoration type are they looking for?',['Printed','Embroidery','Not Sure – Recommend'],{required:true}),multi('decor_locations','Where will the design go?',['Left Chest','Full Front','Full Back','Sleeve','Hat Front','Hat Side','Other'],{required:true}),select('apparel_art','Does the customer have artwork?',['Yes – Received','Yes – Needs to Send','No – Design Needed'],{required:true}),select('sizes_ready','Do we have the size breakdown?',['Yes','Not Yet'],{required:true}),...(a.sizes_ready==='Yes'?[textQ('size_breakdown','Enter the size breakdown.',{required:true,multiline:true})]:[]),yesNo('personalization','Does the customer need names, numbers, or personalization?',{required:true}),...deadlineQuestions('apparel')]; }

function promo(a){ return [select('promo_type','What product is the customer interested in?',['Drinkware','Pens','Keychains','Bags','Employee Gifts','Customer Gifts','Event Giveaways','Other','Not Sure'],{required:true}),textQ('promo_qty','What quantity does the customer need?',{required:true}),textQ('promo_budget','Did the customer state a budget? If so, enter it.'),select('promo_art','What is the artwork/logo status?',['Received','Customer Needs to Send','Design Needed','Not Sure'],{required:true}),yesNo('promo_personal','Does the product require personalization?',{required:true}),...deadlineQuestions('promo')]; }

function custom(a){ return [textQ('custom_desc','In the customer’s own words, what are they looking for?',{required:true,multiline:true}),textQ('custom_applied','What is the project being applied to or produced on?',{required:true}),textQ('custom_qty','What quantity do they need?',{required:true}),textQ('custom_dims','What are the approximate dimensions, if applicable?'),yesNo('custom_photos','Do we have photos or reference images?',{required:true}),...deadlineQuestions('other')]; }

function deadlineQuestions(prefix){ return [select(prefix+'_deadline_yn','Does the customer have a required completion date?',['No Specific Deadline','Yes'],{required:true}),...(state.answers[prefix+'_deadline_yn']==='Yes'?[textQ(prefix+'_deadline','What date does the customer need the project completed by?',{required:true,placeholder:'MM/DD/YYYY'})]:[])]; }

function allQuestions(){ return [...rootQuestions(state.answers), ...categoryQuestions(state.answers)]; }
function visibleQuestions(){ return allQuestions().filter(x=>x && x.type!=='notice' || x); }
function current(){ const qs=allQuestions(); state.idx=Math.min(state.idx, Math.max(0, qs.length-1)); return qs[state.idx]; }
function setAnswer(id,val){ state.answers[id]=val; persist(); }
function persist(){ const name=[state.answers.first_name,state.answers.last_name].filter(Boolean).join(' '); window.openai?.setWidgetState?.({modelContent:`Creative Coatings intake in progress for ${name||'a customer'}.`,privateContent:state}); }
function isAnswered(question){ if(question.type==='notice') return true; if(question.type==='lookup') return !!state.answers.printavo_contact_id; const v=state.answers[question.id]; if(!question.required) return true; if(question.type==='multi') return Array.isArray(v)&&v.length>0; return typeof v==='string' && v.trim().length>0; }

function next(){ const qs=allQuestions(); const c=qs[state.idx]; if(!isAnswered(c)) return; state.idx=Math.min(state.idx+1, allQuestions().length-1); persist(); render(); }
function back(){ state.idx=Math.max(0,state.idx-1); persist(); render(); }

function missingItems(){
  const misses=[];
  const qs=allQuestions();
  for(const question of qs){ if(question.required && !isAnswered(question)) misses.push(question.label); }
  const a=state.answers;
  if(a.category==='Printed Vinyl Graphics' && a.vinyl_applied_to==='Vehicle' && a.vehicle_photos==='No') misses.push('Required vehicle photos');
  if(a.chrome_photos==='No') misses.push('Clear photos of chrome-delete areas');
  if(a.emblem_blackout==='Yes' && a.emblem_explained!=='Yes') misses.push('Customer confirmation that emblems are replaced, not wrapped');
  if(a.grille_scope==='Entire Grille' && a.grille_explained!=='Yes') misses.push('Customer confirmation of full-grille replacement recommendation');
  if(a.trailer_photos==='No') misses.push('Required trailer photos');
  return [...new Set(misses)];
}

function needsEstimator(){
  const a=state.answers;
  return [a.vehicle_graphics_type,a.vinyl_applied_to,a.film_type,a.sign_type,a.ppf_coverage].includes('Not Sure') ||
    ['Other','Other / Unknown','Not Sure'].includes(a.wall_surface) ||
    ['Other / Unknown'].includes(a.floor_surface) ||
    a.aftermarket_parts==='Yes' || a.ppf_aftermarket==='Yes' || a.grille_scope==='Entire Grille' || a.category==='Other / Custom Project';
}

function status(){ const m=missingItems(); if(m.length) return 'INTAKE INCOMPLETE'; if(needsEstimator()) return 'ESTIMATOR REVIEW REQUIRED'; return 'READY FOR QUOTE'; }

function makeSummary(){
  const a=state.answers; const stat=status(); const lines=[];
  lines.push('PRINTAVO PROJECT SUMMARY','');
  const customerName=[a.first_name,a.last_name].filter(Boolean).join(' ');
  lines.push(`Existing Customer: ${a.existing_customer||''}`);
  lines.push(`Customer: ${customerName}`);
  if(a.business_name) lines.push(`Business: ${a.business_name}`);
  if(a.printavo_company_name && !a.business_name) lines.push(`Business: ${a.printavo_company_name}`);
  if(a.printavo_contact_id) lines.push(`Printavo Contact ID: ${a.printavo_contact_id}`);
  if(a.phone) lines.push(`Phone: ${a.phone}`);
  if(a.email) lines.push(`Email: ${a.email}`);
  if(a.billing_address) lines.push(`Billing Address: ${a.billing_address}`);
  lines.push('');
  lines.push(`Project Type: ${a.category||''}`);
  if(a.vinyl_applied_to) lines.push(`Application: ${a.vinyl_applied_to}`);
  if(a.vehicle) lines.push(`Vehicle: ${a.vehicle}`);
  if(a.vehicle_graphics_type) lines.push(`Graphics Type: ${a.vehicle_graphics_type}`);
  if(a.trailer_type) lines.push(`Trailer: ${a.trailer_type}`);
  if(a.trailer_length||a.trailer_width||a.trailer_height) lines.push(`Trailer Dimensions: ${a.trailer_length||'?'} L × ${a.trailer_width||'?'} W × ${a.trailer_height||'?'} H`);
  if(a.film_type) lines.push(`Window Film Type: ${a.film_type}`);
  if(a.sign_type) lines.push(`Sign Type: ${a.sign_type}`);
  if(a.sign_type==='Banner' && (a.banner_width||a.banner_height)) lines.push(`Banner Size: ${a.banner_width||'?'} × ${a.banner_height||'?'}`);
  if(a.apparel_type) lines.push(`Apparel: ${a.apparel_type}`);
  if(a.promo_type) lines.push(`Promotional Product: ${a.promo_type}`);
  const deadline=Object.keys(a).find(k=>k.endsWith('_deadline') && a[k]);
  if(deadline) lines.push(`Customer Requested Completion Date: ${a[deadline]}`);
  lines.push('','PROJECT DETAILS');
  const skip=new Set(['existing_customer','first_name','last_name','business_name','phone','email','billing_address','category','printavo_lookup','printavo_contact_id','printavo_customer_id','printavo_full_name','printavo_company_name']);
  for(const [k,v] of Object.entries(a)){
    if(skip.has(k) || k.endsWith('_deadline_yn') || !v) continue;
    if(['vehicle','vehicle_graphics_type','trailer_type','trailer_length','trailer_width','trailer_height','film_type','sign_type','apparel_type','promo_type'].includes(k)) continue;
    const label=k.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
    lines.push(`${label}: ${Array.isArray(v)?v.join(', '):v}`);
  }
  lines.push('','INTERNAL ACTION ITEMS');
  const missing=missingItems();
  lines.push(`Missing Items: ${missing.length?missing.join('; '):'None'}`);
  lines.push(`Technical / Estimator Review: ${needsEstimator()?'Yes':'No'}`);
  lines.push('','STATUS',stat);
  return lines.join('\n');
}

function finish(){ state.idx=allQuestions().length; persist(); render(); }

function escapeHtml(s){ return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

function render(){
  const qs=allQuestions();
  if(state.idx>=qs.length){ return renderSummary(); }
  const c=current();
  const progress=Math.round((state.idx/Math.max(1,qs.length))*100);
  let control=''; const val=state.answers[c.id];
  if(c.type==='notice') control=`<div class="notice">${escapeHtml(c.label)}</div>`;
  else if(c.type==='text') control=c.multiline?`<textarea id="entry" placeholder="${escapeHtml(c.placeholder||'Type answer')}">${escapeHtml(val||'')}</textarea>`:`<input id="entry" type="text" inputmode="${escapeHtml(c.inputMode||'text')}" placeholder="${escapeHtml(c.placeholder||'Type answer')}" value="${escapeHtml(val||'')}"/>`;
  else if(c.type==='single') control=`<div class="options">${c.options.map(o=>`<button class="option ${val===o?'selected':''}" data-value="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join('')}</div>`;
  else if(c.type==='multi'){ const arr=Array.isArray(val)?val:[]; control=`<div class="options">${c.options.map(o=>`<button class="option ${arr.includes(o)?'selected':''}" data-value="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join('')}</div><div class="hint" style="margin-top:10px">Select all that apply.</div>`; }
  else if(c.type==='lookup'){
    control=`<div id="lookupBox"><div class="notice">Search Printavo using ${escapeHtml([state.answers.first_name,state.answers.last_name].filter(Boolean).join(' '))}.</div><button class="primary" id="searchPrintavo">Search Printavo</button><div id="lookupResults" style="margin-top:12px"></div></div>`;
  }
  app.innerHTML=`<div class="top"><div><div class="brand">Creative Coatings</div><div class="small">Project Intake</div></div><div class="step">Step ${Math.min(state.idx+1,qs.length)} of ${qs.length}</div></div><div class="progress"><div style="width:${progress}%"></div></div><h2>${escapeHtml(c.label)}</h2>${c.hint?`<div class="hint">${escapeHtml(c.hint)}</div>`:''}${control}<div class="actions"><button class="secondary" id="back" ${state.idx===0?'disabled':''}>Back</button><div class="right"><button class="primary" id="next" ${c.type==='notice'?'':'disabled'}>${state.idx===qs.length-1?'Review Intake':'Continue'}</button></div></div>`;

  document.getElementById('back').onclick=back;
  const nextBtn=document.getElementById('next');
  if(c.type==='notice'){ nextBtn.disabled=false; nextBtn.onclick=next; return; }
  if(c.type==='lookup'){
    nextBtn.disabled=!isAnswered(c);
    const searchBtn=document.getElementById('searchPrintavo');
    const results=document.getElementById('lookupResults');
    if(state.answers.printavo_contact_id){
      results.innerHTML=`<div class="notice">Selected: ${escapeHtml(state.answers.printavo_full_name||'Printavo customer')}${state.answers.printavo_company_name?' — '+escapeHtml(state.answers.printavo_company_name):''}</div>`;
    }
    searchBtn.onclick=async()=>{
      const query=[state.answers.first_name,state.answers.last_name].filter(Boolean).join(' ').trim();
      if(!query) return;
      searchBtn.disabled=true; searchBtn.textContent='Searching...'; results.innerHTML='';
      try{
        const r=await callTool('search_printavo_contacts',{query});
        const contacts=r?.structuredContent?.contacts||r?.content?.find?.(x=>x.type==='json')?.json?.contacts||[];
        if(!contacts.length){
          results.innerHTML=`<div class="notice">No matching customer found in Printavo. Verify spelling or use Back and choose No for a new customer.</div>`;
        }else{
          results.innerHTML=`<div class="options">${contacts.map((x,i)=>{
            const name=x.fullName||[x.firstName,x.lastName].filter(Boolean).join(' ')||'Unnamed contact';
            const company=x.customer?.companyName? ` — ${x.customer.companyName}` : '';
            const detail=[x.email,x.phone].filter(Boolean).join(' • ');
            return `<button class="option contact-result" data-i="${i}">${escapeHtml(name+company)}${detail?'<div class="small">'+escapeHtml(detail)+'</div>':''}</button>`;
          }).join('')}</div>`;
          document.querySelectorAll('.contact-result').forEach(btn=>btn.onclick=()=>{
            const x=contacts[Number(btn.dataset.i)];
            state.answers.printavo_contact_id=String(x.id||'');
            state.answers.printavo_customer_id=String(x.customer?.id||'');
            state.answers.printavo_full_name=x.fullName||[x.firstName,x.lastName].filter(Boolean).join(' ');
            state.answers.printavo_company_name=x.customer?.companyName||'';
            state.answers.phone=x.phone||'';
            state.answers.email=x.email||'';
            persist(); render();
          });
        }
      }catch(e){
        results.innerHTML=`<div class="notice">Printavo lookup failed. Try again in a moment.</div>`;
      }finally{
        searchBtn.disabled=false; searchBtn.textContent='Search Printavo';
      }
    };
    nextBtn.onclick=next;
    return;
  }
  if(c.type==='text'){
    const entry=document.getElementById('entry');
    const sync=()=>{ setAnswer(c.id,entry.value.trim()); nextBtn.disabled=c.required&&!entry.value.trim(); };
    entry.addEventListener('input',sync); sync();
    entry.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!c.multiline&&!nextBtn.disabled) next(); });
  } else {
    document.querySelectorAll('.option').forEach(btn=>btn.onclick=()=>{
      const choice=btn.dataset.value;
      if(c.type==='single'){ setAnswer(c.id,choice); nextBtn.disabled=false; render(); }
      else { const arr=Array.isArray(state.answers[c.id])?[...state.answers[c.id]]:[]; const i=arr.indexOf(choice); if(i>=0) arr.splice(i,1); else arr.push(choice); setAnswer(c.id,arr); render(); }
    });
    nextBtn.disabled=!isAnswered(c);
  }
  nextBtn.onclick=()=>{ if(state.idx===allQuestions().length-1) finish(); else next(); };
}

async function callTool(name,args){
  if(window.openai?.callTool) return window.openai.callTool(name,args);
  const id=Math.floor(Math.random()*1e9);
  return new Promise((resolve,reject)=>{
    const onMsg=(event)=>{ if(event.source!==window.parent) return; const m=event.data; if(m?.jsonrpc==='2.0'&&m.id===id){ window.removeEventListener('message',onMsg); if(m.error) reject(m.error); else resolve(m.result); }};
    window.addEventListener('message',onMsg);
    window.parent.postMessage({jsonrpc:'2.0',id,method:'tools/call',params:{name,arguments:args}},'*');
  });
}

function renderSummary(){
  const stat=status(); const summary=makeSummary(); const cls=stat==='READY FOR QUOTE'?'green':stat==='ESTIMATOR REVIEW REQUIRED'?'yellow':'red';
  app.innerHTML=`<div class="top"><div><div class="brand">Creative Coatings</div><div class="small">Project Intake Review</div></div></div><span class="status ${cls}">${escapeHtml(stat)}</span><div class="summary">${escapeHtml(summary)}</div><div class="actions"><button class="secondary" id="back">Back</button><div class="right"><button class="primary" id="submit">Send Summary to Chat</button></div></div>`;
  document.getElementById('back').onclick=()=>{state.idx=Math.max(0,allQuestions().length-1);persist();render();};
  document.getElementById('submit').onclick=async()=>{
    const btn=document.getElementById('submit'); btn.disabled=true; btn.textContent='Sending...';
    try{
      if(window.openai?.sendFollowUpMessage){
        await window.openai.sendFollowUpMessage({prompt:`Project intake complete. Use this Printavo-ready summary:

${summary}`});
        btn.textContent='Sent to Chat';
      }else if(navigator.clipboard?.writeText){
        await navigator.clipboard.writeText(summary);
        btn.textContent='Summary Copied';
      }else{
        btn.textContent='Summary Ready';
      }
    }catch(e){ btn.disabled=false; btn.textContent='Try Again'; }
  };
}

render();
</script>
